[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-bugfix-agent"
version = "0.1.0"
description = "A reproducible, repository-aware bug-fix research prototype."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.45", "accelerate>=0.34"]

[project.scripts]
bugfix-agent = "bugfix_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

